[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-identity"
version = "0.15.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.135.0", "httpx>=0.28.1", "pyjwt[crypto]>=2.10.1", "eth-account>=0.13.0", "eth-abi>=5.0.0", "eth-utils>=5.0.0", "eth-keys>=0.7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_identity"]

[dependency-groups]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/contracts", "/docs", "/pyproject.toml", "/uv.lock", "/README.md"]
