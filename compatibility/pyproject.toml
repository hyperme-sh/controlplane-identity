[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-legacy-auth-bridge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["controlplane-identity>=0.1.0", "pyjwt>=2.10.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_legacy_auth_bridge"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md"]
