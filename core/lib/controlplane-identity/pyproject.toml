[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-identity"
version = "0.10.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.135.0", "httpx>=0.28.1", "pyjwt[crypto]>=2.10.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_identity"]
